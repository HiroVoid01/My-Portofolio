<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JACKI - Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="contact-page"> 
    <!-- EFEK TRANSISI PINTU -->
    <div class="door-transition">
        <div class="door door-left"></div>
        <div class="door door-right"></div>
    </div>

    <!-- VIDEO BACKGROUND UNTUK CONTACT -->
    <video autoplay loop muted playsinline class="video-bg">
        <!-- Siapkan video baru bernama bg-contact.mp4 -->
        <source src="assets/bg-contact.mp4" type="video/mp4">
    </video>

    <!-- LAPISAN PENGATUR TRANSPARANSI -->
    <div class="video-overlay"></div>

    <header class="project-header">
        <h1 class="brand-name-small">
            <span class="letter white-bg">J</span><span class="letter black-bg">A</span><span class="letter white-bg">C</span><span class="letter black-bg">K</span><span class="letter white-bg tilt-right">I</span>
        </h1>
        <div class="page-title">
            <h2>C O N T A C T</h2>
            <a href="index.html" class="back-btn">ESC - BACK</a>
        </div>
    </header>

    <main class="content-container">
        <!-- Tombol-tombol link kontak -->
        <div class="contact-links">
            <a href="mailto:stefanuspandi22@gmail.com" class="contact-btn">H I R E &nbsp;&nbsp;&nbsp; M E</a>
            <a href="https://wa.me/6282198995676" class="contact-btn">W H A T S A P P</a>
            <a href="Maaf ya, masih belum tersedia" class="contact-btn">I N S T A G R A M</a>
            <a href="Maaf ya, masih belum tersedia" class="contact-btn">Y O U T U B E</a>
        </div>
    </main>

    <script>
        const transition = document.querySelector('.door-transition');

        // 1. Otomatis BUKA pintu saat halaman selesai dimuat
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { transition.classList.add('is-open'); }, 100);
        });

        // Fungsi TUTUP pintu lalu pindah
        function goToPage(url) {
            transition.classList.remove('is-open'); // Pintu menutup
            setTimeout(() => { window.location.href = url; }, 500); // Tunggu 0.5 detik baru pindah
        }

        // 2. Tutup pintu jika tekan ESC
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') goToPage('index.html');
        });

        // 3. Tutup pintu jika tombol dengan klik mouse (kecuali WhatsApp)
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                const targetUrl = this.getAttribute('href');
                if (targetUrl && targetUrl !== '#' && !targetUrl.includes('http')) {
                    e.preventDefault(); // Cegah pindah langsung
                    goToPage(targetUrl);
                }
            });
        });
    </script>
</body>
</html>
